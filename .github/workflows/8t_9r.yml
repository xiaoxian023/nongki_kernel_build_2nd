Name: Build OnePlus 8T / 9R (Evolution X 16 A16)

on:
  workflow_dispatch:

env:
  # 设备环境配置
  DEVICE_NAME : "OnePlus 8T"
  DEVICE_CODENAME : "kebab"

  # 编译指令优化：在此处追加 KCFLAGS="-Wno-error" 完美降级警告拦截，不破坏文件结构
  CUSTOM_CMDS : "CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS : "LLVM=1 LLVM_IAS=1 KCFLAGS=-Wno-error"

  # 源码与分支
  KERNEL_SOURCE : "https://github.com/Evolution-X-Devices/kernel_oneplus_sm8250.git"
  KERNEL_BRANCH : "bka"

  # Google 官方 AOSP Clang 工具链（完美兼容 Android 16）
  CLANG_SOURCE : "https://github.com/bachnxuan/aosp_clang_mirror/releases/download/clang-r574158-14475230/clang-r574158.tar.gz"
  CLANG_BRANCH : ""

  GCC_GNU : false
  GCC_64_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git"
  GCC_64_BRANCH : "android12L-release"
  GCC_32_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH : "android12L-release"

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME : "vendor/kona-perf_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  KERNELSU_SOURCE : ""
  KERNELSU_BRANCH : ""

  # 自动集成 KernelSU Next 
  KERNELSU_AUTO_GET : "true"
  KERNELSU_AUTO_FORK : "resukisu"

  # 自动集成 SUSFS
  SUSFS_ENABLE : true
  SUSFS_FIXED : false

  # 你的专属 AnyKernel3 仓库
  AK3_SOURCE : "https://github.com/xiaoxian023/anykernel3/AnyKernel3.git"
  AK3_BRANCH : "master"

  BOOT_SOURCE : ""
  NEED_DTBO : false
  NEED_SAFE_DTBO : false
  ROM_TEXT : "evox16_a16"
  PYTHON_VERSION: "3"
  PACK_METHOD: "Anykernel3"
  PACK_KMODULES: "false"
  KERNELSU_METHOD: "shell"
  PATCHES_SOURCE: ""
  PATCHES_BRANCH: ""
  SUSFS_FOLDER_FIXED: ""
  SUSFS_PATCH_FIXED: ""
  REKERNEL_ENABLE: "false"
  HOOK_METHOD: "syscall"
  KERNEL_PATCH: "false"
  KPM_ENABLE: "false"
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false"
  KPM_PATCH_SOURCE: ""
  BASEBAND_GUARD_ENABLE: "false"
  BASEBAND_GUARD_BOOT: "false"
  GENERATE_DTB: "true"
  GENERATE_CHIP: "qcom"
  BUILD_DEBUGGER: "false"
  SKIP_PATCH: "false"
  BUILD_OTHER_CONFIG: "false"
  FREE_MORE_SPACE: "true"

jobs:
  build-kernel:
    name: OnePlus 8T / 9R (Evolution X 16 A16)
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v4

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get neccssary tools
        uses: ./.github/workflows/build-ready

      - name: 🪝 Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs

      - name: 🔗 Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe

      - name: 🧰 Patch Kernel of Re:Kernel
        uses: ./.github/workflows/patch-rekernel

      - name: 🔒 Patch Kernel of Baseband Guard
        uses: ./.github/workflows/patch-baseband-guard

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files
